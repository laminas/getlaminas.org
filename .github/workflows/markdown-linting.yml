name: "Markdown files linting"

on:
  pull_request:
  push:
    branches:
    tags:

jobs:
  linting:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25
          with:
            config: '.markdownlint.json'
            globs: |
              **/*.md
              !README.md
              !LICENSE.md
              !COPYRIGHT.md
              !bootstrap
              !public
