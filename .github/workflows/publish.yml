name: Publish to live

on:
  workflow_dispatch:

jobs:
  push-to-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging
          fetch-depth: 0
      - run: |
          git push origin origin/staging:master

